spring.application.name=plataforma-seleccion-practicantes

server.port=${BACKEND_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/practicantes}
spring.datasource.username=${POSTGRES_USER:practicantes}
spring.datasource.password=${POSTGRES_PASSWORD:practicantes-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.storage.local-path=${APP_STORAGE_LOCAL_PATH:../uploads}

