spring.application.name=plataforma-seleccion-practicantes
spring.config.import=optional:file:../.env[.properties]

server.port=${BACKEND_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/practicantes}
spring.datasource.username=${POSTGRES_USER:practicantes}
spring.datasource.password=${POSTGRES_PASSWORD:practicantes-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:no-reply@practicantes.local}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.storage.local-path=${APP_STORAGE_LOCAL_PATH:../uploads}
app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.enabled=${APP_ADMIN_ENABLED:true}
app.security.jwt-secret=${JWT_SECRET:}
app.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
app.security.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:5}

