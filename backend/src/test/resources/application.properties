spring.datasource.url=jdbc:h2:mem:practicantes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=no-reply@practicantes.local
app.bootstrap-admin.enabled=false
app.storage.local-path=target/test-uploads
app.cors.allowed-origin=http://localhost:5173
app.security.jwt-secret=unit-test-secret-with-at-least-thirty-two-characters
app.security.access-token-minutes=15
app.security.refresh-token-days=7
app.security.rate-limit-per-minute=5

