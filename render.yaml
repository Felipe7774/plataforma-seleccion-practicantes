services:
  - type: web
    name: practicantes-api-felipe7774
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: practicantes-db
          property: connectionString
      - key: APP_STORAGE_LOCAL_PATH
        value: /tmp/uploads
      - key: APP_CORS_ALLOWED_ORIGIN
        value: https://practicantes-web-felipe7774.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_MAIL_ENABLED
        value: "false"

  - type: web
    name: practicantes-web-felipe7774
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "80"
      - key: BACKEND_URL
        value: https://practicantes-api-felipe7774.onrender.com

databases:
  - name: practicantes-db
    region: ohio
    plan: free
    postgresMajorVersion: "17"
    databaseName: practicantes
    user: practicantes
