services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-practicantes}
      POSTGRES_USER: ${POSTGRES_USER:-practicantes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practicantes-local}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@practicantes.local}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_STORAGE_LOCAL_PATH: /app/uploads
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Define APP_ADMIN_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET de al menos 32 caracteres en .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  uploads_data:
