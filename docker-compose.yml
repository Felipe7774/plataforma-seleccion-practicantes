name: seleccion-practicantes

services:
  postgres:
    image: postgres:17-alpine
    container_name: practicantes-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practicantes}
      POSTGRES_USER: ${POSTGRES_USER:-practicantes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practicantes-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: practicantes-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres_data:

